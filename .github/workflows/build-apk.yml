name: Build Heretic APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Use the runner's preinstalled Android SDK. Do NOT use
      # android-actions/setup-android@v3: it installs the obsolete
      # `tools` package by default and sdkmanager exits 1
      # ("Failed to find package 'tools'").
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install platform and build-tools
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK
        run: ./build.sh

      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/34.0.0/apksigner verify heretic.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: heretic-apk
          path: heretic.apk
          if-no-files-found: error
